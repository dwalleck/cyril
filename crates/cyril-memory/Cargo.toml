[package]
name = "cyril-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cyril-owned local memory runtime domain and persistence"

[lints]
workspace = true

[dependencies]
cyril-core = { path = "../cyril-core" }
constant_time_eq = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
rusqlite = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
interprocess = { workspace = true }
win-security-identifier = { workspace = true }
windows-permissions = { workspace = true }
widestring = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
