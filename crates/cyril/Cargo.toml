[package]
name = "cyril"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform TUI client for Kiro CLI via the Agent Client Protocol (ACP)"

[lints]
workspace = true

[[bin]]
name = "cyril"
path = "src/main.rs"

[features]
default = []
# Speech-to-text voice input (ROADMAP CN2). Off by default — pulls in the
# cyril-voice engine and (later) its audio/ML deps. Build with `--features voice`.
voice = ["dep:cyril-voice"]
# KAS engine support (ADR-0002). Default-off; forwards to cyril-core's `kas`
# gate (empty in KAS-0). Build with `--features kas`.
kas = ["cyril-core/kas"]

[dependencies]
cyril-core = { path = "../cyril-core" }
cyril-memory = { path = "../cyril-memory" }
cyril-ui = { path = "../cyril-ui" }
cyril-voice = { path = "../cyril-voice", optional = true }
getrandom = { workspace = true }
hex = { workspace = true }
process-wrap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
# Test builds re-open the lib dependency with `test-support` so app.rs tests
# share cyril-core's canonical test scaffolding (CaptureWriter). Dev-dependency
# features never leak into the plain `[dependencies]` lib build.
cyril-core = { path = "../cyril-core", features = ["test-support"] }
rusqlite = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
