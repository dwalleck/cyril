[package]
name = "cyril-j7um-platform-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
constant_time_eq = "0.4"
process-wrap = { version = "9.1", default-features = false, features = ["creation-flags", "job-object", "kill-on-drop", "process-group", "tokio1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.50", default-features = false, features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
interprocess = { version = "2.4.3", default-features = false, features = ["tokio"] }
win-security-identifier = "0.2"
widestring = "1.2"
