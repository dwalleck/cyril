name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Release - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: cyril-linux-x86_64.tar.gz
          - os: macos-latest
            artifact_name: cyril-macos-aarch64.tar.gz
          - os: windows-latest
            artifact_name: cyril-windows-x86_64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build -p cyril --release --all-features --bins

      - name: Stage binaries (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist/package
          cp target/release/cyril dist/package/cyril
          cp target/release/cyril-memory-runtime dist/package/cyril-memory-runtime
          tar -czf "dist/${{ matrix.artifact_name }}" -C dist/package .

      - name: Stage binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package
          Copy-Item target/release/cyril.exe dist/package/cyril.exe
          Copy-Item target/release/cyril-memory-runtime.exe dist/package/cyril-memory-runtime.exe
          Compress-Archive -Path dist/package/* -DestinationPath "dist/${{ matrix.artifact_name }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
