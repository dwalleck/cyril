name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs on a PR branch when it's re-pushed, but never cancel
# a run on main (keep main's history fully validated). One lane per ref.
#
# `test` and `default-features` each put a macOS job in the matrix; conditional
# code-review tooling can add a third. macOS concurrency is an account-wide
# pool shared with every other repository. Without a lane, repeated pushes
# stack runs that hold those slots while unrelated projects wait.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Validate commit messages follow conventional commits.
  commitlint:
    name: Validate Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          git fetch origin ${{ github.base_ref }}
          COMMITS=$(git log --format="%s" origin/${{ github.base_ref }}..HEAD)

          # Type required; optional lowercase scope; optional `!`; >=3 char description.
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\([a-z][a-z0-9-]*\))?!?: .{3,}"

          FAILED=0
          while IFS= read -r msg; do
            if [[ -z "$msg" ]]; then
              continue
            fi
            if [[ ! "$msg" =~ $PATTERN ]] && [[ ! "$msg" =~ ^Merge ]]; then
              echo "❌ Invalid commit: $msg"
              FAILED=1
            else
              echo "✅ Valid commit: $msg"
            fi
          done <<< "$COMMITS"

          if [[ $FAILED -eq 1 ]]; then
            echo ""
            echo "Expected format: <type>[optional scope]: <description>"
            echo "Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore"
            echo "Scopes should be lowercase (e.g., ui, core, voice, commands)"
            echo "Description must be at least 3 characters"
            exit 1
          fi
          echo ""
          echo "All commits follow conventional format!"

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The repo's rust-toolchain.toml pins the channel + components (rustfmt,
      # clippy), so checkout is enough — the toolchain file drives the install.
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
        with:
          tool: ${{ runner.os == 'Windows' && 'cargo-nextest@0.9.148' || 'nextest' }}

      # Temporary U62F observation: only this workspace all-features step emits phases.
      - name: Prepare Windows U62F phase capture
        id: u62f_prepare
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "cyril-u62f-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'U62F evidence root must be fresh' }
          $root = (New-Item -ItemType Directory -Path $root).FullName
          $phases = (New-Item -ItemType Directory -Path (Join-Path $root 'phases')).FullName
          "evidence_root=$root" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "phase_directory=$phases" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          foreach ($name in @(
            'CYRIL_U62F_POST_BIND_DELAY_500MS', 'CYRIL_U62F_READY_AUTH_MISMATCH',
            'NEXTEST_PROFILE', 'NEXTEST_TEST_THREADS',
            'CYRIL_MEMORY_PHASE_PROBE', 'CYRIL_MEMORY_PHASE_DIRECTORY', 'CYRIL_MEMORY_PROBE_SOURCE'
          )) {
            if (Test-Path "Env:$name") { throw "U62F capture requires absent inherited input: $name" }
          }
          if ($env:RUST_BACKTRACE -cne '1') { throw 'U62F capture requires existing RUST_BACKTRACE=1' }
          $checkout = (& git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read actual checkout SHA' }
          $checkoutTree = (& git rev-parse 'HEAD^{tree}' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read actual checkout tree' }
          $rustc = (& rustc -Vv | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read rustc version' }
          $cargo = (& cargo --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo version' }
          $nextest = (& cargo nextest --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not read nextest version' }
          if ($nextest -notmatch '^cargo-nextest 0\.9\.148(?:\s|$)') { throw 'Unexpected nextest version' }
          $paths = @(& git ls-files -- crates/cyril-memory crates/cyril/tests/memory_runtime.rs crates/cyril/src/bin/cyril-memory-runtime.rs Cargo.toml crates/cyril/Cargo.toml Cargo.lock rust-toolchain.toml .github/workflows/ci.yml .cargo .config .cyril-u62f/probe.rs .cyril-u62f/source-pins.json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate whitelisted source/configuration paths' }
          $sourceHashes = @(foreach ($path in $paths) {
            $file = Get-Item -LiteralPath $path
            [ordered]@{
              path = $path
              bytes = $file.Length
              sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $sourceHashes | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $root 'source-hashes.json') -Encoding utf8
          Copy-Item -LiteralPath '.cyril-u62f/source-pins.json' -Destination (Join-Path $root 'source-pins.json')
          $os = Get-CimInstance Win32_OperatingSystem
          $system = Get-CimInstance Win32_ComputerSystem
          [ordered]@{
            kind = 'u62f-hosted-no-fault-preparation'
            observed_utc = [DateTime]::UtcNow.ToString('o')
            checkout_sha = $checkout
            checkout_tree = $checkoutTree
            github_sha = $env:GITHUB_SHA
            pr_head_sha = '${{ github.event.pull_request.head.sha }}'
            pr_base_sha = '${{ github.event.pull_request.base.sha }}'
            c6_baseline_sha = '96fae2712888489dccd4cdfbf60e290879e8f6a5'
            diagnostic_source_sha = 'dc3fd535c3a78a9332abbdd6cb2cb267d6caa5ee'
            repository = $env:GITHUB_REPOSITORY
            ref = $env:GITHUB_REF
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            job = $env:GITHUB_JOB
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            failed_image_comparison_reference = 'windows-2025-vs2026 / 20261018.275.1'
            os_caption = $os.Caption
            os_version = $os.Version
            os_build = $os.BuildNumber
            logical_processors = $system.NumberOfLogicalProcessors
            ram_bytes = $system.TotalPhysicalMemory
            rustc = $rustc
            cargo = $cargo
            nextest = $nextest
            powershell = $PSVersionTable.PSVersion.ToString()
            rust_backtrace = $env:RUST_BACKTRACE
            cargo_incremental = $env:CARGO_INCREMENTAL
            cargo_target_dir = $env:CARGO_TARGET_DIR
            command = 'cargo nextest run --workspace --all-features'
            phase_scope = 'workspace-all-features'
            scheduling = 'original default profile, concurrency and fail-fast; no overrides'
            fault_inputs = 'both absent; no controlled input'
            phase_directory = $phases
            source_hashes = 'source-hashes.json'
            baseline_equivalence = 'not claimed; compare actual published head/base/checkout/tree to C6 baseline plus allowlisted diagnostic overlay composition'
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $root 'provenance.json') -Encoding utf8

      - name: Run tests
        id: u62f_test
        env:
          CYRIL_MEMORY_PHASE_PROBE: ${{ runner.os == 'Windows' && '1' || '0' }}
          CYRIL_MEMORY_PHASE_DIRECTORY: ${{ steps.u62f_prepare.outputs.phase_directory }}
        run: cargo nextest run --workspace --all-features

      - name: Finalize Windows U62F phase capture
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        env:
          U62F_EVIDENCE_ROOT: ${{ steps.u62f_prepare.outputs.evidence_root }}
          U62F_TEST_OUTCOME: ${{ steps.u62f_test.outcome }}
          U62F_PREPARATION_OUTCOME: ${{ steps.u62f_prepare.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:U62F_EVIDENCE_ROOT) { throw 'No fresh U62F evidence root was prepared' }
          $root = $env:U62F_EVIDENCE_ROOT
          [ordered]@{
            observed_utc = [DateTime]::UtcNow.ToString('o')
            preparation_step_outcome = $env:U62F_PREPARATION_OUTCOME
            original_test_step_outcome = $env:U62F_TEST_OUTCOME
            native_exit_code = $null
            native_exit_code_source = 'not captured here; retain the complete original Actions job log separately'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'step-outcome.json') -Encoding utf8
          # Decode only the existing helper's identity records. Never treat cached
          # fixture glob matches as executed binaries, or hash them before launch.
          $binaryPins = @()
          foreach ($phase in @(Get-ChildItem -LiteralPath (Join-Path $root 'phases') -File -Filter '*.log')) {
            $lineNumber = 0
            foreach ($line in Get-Content -LiteralPath $phase.FullName) {
              $lineNumber++
              if ($line -notmatch '^CYRIL_U62F_PHASE pid=(?<pid>\d+) component=(?<component>\S+) .* event="identity" detail=(?<detail>".*")$') { continue }
              $pidValue = $Matches.pid
              $component = $Matches.component
              $identity = ConvertFrom-Json -InputObject $Matches.detail
              if ($identity -notmatch '^\("(?<role>fixture_executor|child_entry|child_configuration)", "[0-9a-f]{40}", None, "cyril-u62f-phase-v1", Ok\((?<path>"(?:\\.|[^"\\])*")\)\)$') {
                throw "Unrecognized executable identity at $($phase.Name):$lineNumber"
              }
              $role = $Matches.role
              $path = ConvertFrom-Json -InputObject $Matches.path
              $file = Get-Item -LiteralPath $path
              if (($role -eq 'fixture_executor' -and $file.Name -notmatch '^memory_runtime-[0-9a-f]+\.exe$') -or
                  ($role -in @('child_entry', 'child_configuration') -and $file.Name -cne 'cyril-memory-runtime.exe')) {
                throw "Unexpected executable role/path at $($phase.Name):$lineNumber"
              }
              $binaryPins += [ordered]@{
                phase_file = "phases/$($phase.Name)"
                identity_line = $lineNumber
                pid = $pidValue
                component = $component
                role = $role
                executable = $file.FullName
                bytes = $file.Length
                sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                observed_utc = [DateTime]::UtcNow.ToString('o')
              }
            }
          }
          ConvertTo-Json -InputObject $binaryPins -Depth 4 | Set-Content -LiteralPath (Join-Path $root 'executed-binaries.json') -Encoding utf8
          if ($binaryPins.Count -eq 0) { throw 'No executable identities were retained; phase evidence is incomplete' }

      - name: Upload Windows U62F phase capture
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: u62f-windows-workspace-all-features-phases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.u62f_prepare.outputs.evidence_root }}
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false

      - name: Run doc tests
        run: cargo test --doc --workspace --all-features

      - name: Qualify resolved native prefix
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo run -p cyril-core --features kas --profile test --example review_prefix -- powershell windows-powershell
            cargo run -p cyril-core --features kas --profile test --example review_prefix -- pwsh pwsh
          else
            cargo run -p cyril-core --features kas --profile test --example review_prefix -- bash posix
          fi

      - name: Challenge native Windows constructor guards
        if: runner.os == 'Windows'
        run: python .cyril-jlxx/oracles/windows-construction.py

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is deliberately absent. This job is a compile check -- it
        # uploads nothing, and `release.yml` is what builds macOS artifacts on
        # a tag. What `cargo build --release` proves over `cargo test` is
        # release-profile compilation and compiling without dev-dependencies in
        # the graph, and neither is platform-specific: feature unification
        # resolves identically everywhere, so Linux catches both first.
        #
        # macOS concurrency is an account-wide pool of five shared across every
        # repository, and a macOS leg is the slowest in the matrix. `test` still
        # compiles this crate on macOS, so a Darwin-only `cfg` block is still
        # type-checked there.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --all-features

  kas-feature:
    name: KAS Feature
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # ADR-0002: the `kas` feature must build/lint/test in ISOLATION (not only via
      # the --all-features lanes) so it cannot bitrot under "warnings are errors".
      # `-p cyril-core` matters: the gated code (convert::kas, kas auth/host-io)
      # and its fences live there, and clippy/nextest only target the SELECTED
      # packages — `-p cyril` alone compiles cyril-core's kas code but never
      # lints it or runs its tests (cyril-vgcm review, PR #51).
      - name: Build (--features kas)
        run: cargo build -p cyril -p cyril-core --features kas

      - name: Clippy (--features kas)
        run: cargo clippy -p cyril -p cyril-core --features kas --all-targets -- -D warnings

      - name: Test (--features kas)
        run: cargo nextest run -p cyril -p cyril-core --features kas

  default-features:
    name: Default Features
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Workspace defaults unify KAS through workbench. Select the production
      # package independently to prove its default feature policy.
      - name: Build (binary default features)
        run: cargo build -p cyril --bins

      - name: Test (binary default features)
        run: cargo nextest run -p cyril

      # Retain workspace-default coverage in addition to package isolation.
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo nextest run --workspace

      # No-default exclusion must also select the binary independently: a
      # workspace invocation would re-enable KAS via workbench.
      - name: Build (binary without KAS)
        run: cargo build -p cyril --no-default-features --bins

      - name: Clippy (binary without KAS)
        run: cargo clippy -p cyril --no-default-features --all-targets -- -D warnings

      - name: Test (binary without KAS)
        run: cargo nextest run -p cyril --no-default-features

      - name: Clippy (core without KAS)
        run: cargo clippy -p cyril-core --no-default-features --all-targets -- -D warnings

      - name: Test (core without KAS)
        run: cargo nextest run -p cyril-core --no-default-features

  # cyril-4rc1: the worktree helper + guard are dev tooling (bash), not product
  # code, so they ride an ubuntu-only shell job rather than the Rust matrix.
  worktree-tooling:
    name: Worktree Tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Worktree helper + guard fences
        run: bash scripts/tests/worktree_test.sh

  # The code-review self-test holds a macOS slot, so a PR runs it only when it touches
  # the tooling. main always runs it, keeping main's history fully validated.
  code-review-tooling-changed:
    name: Code Review Tooling (changed?)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE"
          if git diff --name-only "origin/$BASE...HEAD" \
              | grep -qE '^(experiments/code-review-workflow/|\.kiro/|crates/cyril-review/|crates/cyril/src/(main|crtool)\.rs$|crates/cyril/Cargo\.toml$|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  code-review-tooling:
    name: Code Review Tooling (${{ matrix.os }})
    needs: code-review-tooling-changed
    if: needs.code-review-tooling-changed.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # No lockfile or dependency list to key a cache on: the scripts have no dependencies.
          enable-cache: false

      # Offline: runs the recipe's own crtool command lines through this platform's
      # shell (PowerShell on Windows, as KAS does there) and every crtool subcommand.
      - name: crtool self-test
        run: uv run --script experiments/code-review-workflow/selftest_crtool.py

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # The recipe cyril embeds, the experiment's recipe and its cr-* agent
      # mirrors are all generated: a hand edit or a stale output fails here
      # rather than being regenerated silently. Linux only: Windows checkouts
      # convert the experiment's .kiro files to CRLF.
      - name: Generated review assets are in sync
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out="$RUNNER_TEMP/review-assets"
          python3 experiments/code-review-workflow/build_recipe.py --cyril --out "$out/cyril-review.workflow.json"
          python3 experiments/code-review-workflow/build_recipe.py --out "$out/code-review-max.workflow.json"
          python3 experiments/code-review-workflow/build_recipe.py --mirror-agents "$out/agents"
          diff -u crates/cyril-review/assets/cyril-review.workflow.json "$out/cyril-review.workflow.json"
          diff -u .kiro/workflows/code-review-max.workflow.json "$out/code-review-max.workflow.json"
          for role in finder verifier clerk commenter; do
            diff -u ".kiro/agents/cr-$role.md" "$out/agents/cr-$role.md"
          done

      - name: Native crtool (golden runs, check command, CLI)
        shell: bash
        run: |
          cargo test -p cyril-review --target-dir target
          cargo test -p cyril --test crtool_cli --target-dir target

  # Summary job that requires all other jobs to pass — use this as the single
  # required status check in branch protection.
  ci-success:
    name: CI Success
    if: always()
    needs: [commitlint, format, lint, test, build, kas-feature, default-features, worktree-tooling,
            code-review-tooling-changed, code-review-tooling]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          # commitlint is skipped on push events, so "skipped" is allowed.
          if [[ "${{ needs.commitlint.result }}" != "success" ]] && \
             [[ "${{ needs.commitlint.result }}" != "skipped" ]]; then
            echo "Commit validation failed"
            exit 1
          fi
          if [[ "${{ needs.format.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.kas-feature.result }}" != "success" ]] || \
             [[ "${{ needs.default-features.result }}" != "success" ]] || \
             [[ "${{ needs.worktree-tooling.result }}" != "success" ]] || \
             [[ "${{ needs.code-review-tooling-changed.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          # Skipped when the PR does not touch the code-review tooling.
          if [[ "${{ needs.code-review-tooling.result }}" != "success" ]] && \
             [[ "${{ needs.code-review-tooling.result }}" != "skipped" ]]; then
            echo "Code review tooling failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
