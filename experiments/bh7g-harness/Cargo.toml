[package]
name = "bh7g-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cyril-core = { path = "../../crates/cyril-core", features = ["kas"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
